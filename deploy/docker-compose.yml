name: privacy-preserving-helper
services:

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    expose:
      - "80"
    networks:
      privacy-preserving-helper-network:
      reverse-proxy-network:
          aliases:
            - privacy-helper-web
    depends_on:
      - app-service
    restart: unless-stopped


  app-service:
    build:
      context: ..
      dockerfile: apps/app-service/Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - privacy-preserving-helper-network
    restart: unless-stopped

networks:
  privacy-preserving-helper-network: {}

  reverse-proxy-network:
    external: true