name: Deploy to Server

on:
  push:
    branches: [ "production" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.4
        env:
          BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
          TZ: ${{ secrets.TZ }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # tell the action which env variables to pass to the remote script
          envs: BACKEND_CORS_ORIGINS,TZ
          script: |
            set -e
            
            cd /opt/privacy-preserving-helper

            echo "--- Generating .env file ---"
            
            # Disable shell debug to avoid leaking secrets
            set +x
            # Backup existing .env if it exists
            if [ -f deploy/.env ]; then
              cp deploy/.env deploy/.env.bak
            fi

            {
              echo "BACKEND_CORS_ORIGINS=$BACKEND_CORS_ORIGINS"
              echo "TZ=$TZ"
            } > deploy/.env.tmp

            mv deploy/.env.tmp deploy/.env
            
            echo "--- .env file created ---"

            echo "--- Pulling latest code ---"
            git fetch origin
            git reset --hard origin/production

            echo "--- Rebuilding Docker containers ---"
            docker compose -f deploy/docker-compose.yml up -d --build
            
            docker image prune -f